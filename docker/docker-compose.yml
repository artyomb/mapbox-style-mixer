services:
  mapbox_style_mixer:
    image: ${REGISTRY_HOST}/mapbox-style-mixer
    build:
      context: ../src
      additional_contexts:
        docker: ../docker
      dockerfile: ../docker/ruby/Dockerfile
    ports:
      - 7000:7000
    environment:
      - CONFIG_PATH=/configs/styles_config.yaml
    volumes:
      - ../src/configs:/configs
